<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Valorize AI note記事レビュー</title>
  <link rel="stylesheet" href="assets/review-site.css">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">Valorize AI</p>
      <h1>note記事レビュー</h1>
    </div>
    <p class="header-note">社内確認用。noindex設定済みですが、機密情報は掲載しないでください。</p>
  </header>

  <main class="review-board">
    <details class="status-section">
      <summary>
        <span>レビュー前記事</span>
        <span class="count" data-count-for="review-pending">0</span>
      </summary>
      <ol class="article-list" id="review-pending">
        <li class="empty">レビュー前の記事はまだありません。</li>
      </ol>
    </details>

    <details class="status-section">
      <summary>
        <span>採用済み記事</span>
        <span class="count" data-count-for="approved">0</span>
      </summary>
      <ol class="article-list" id="approved">
        <li class="empty">採用済みの記事はまだありません。</li>
      </ol>
    </details>

    <details class="status-section" open>
      <summary>
        <span>不採用記事</span>
        <span class="count" data-count-for="rejected">0</span>
      </summary>
      <ol class="article-list" id="rejected">
        <li class="article-item">
          <a class="article-link" href="articles/001/">
            <span class="article-id">001</span>
            <span class="article-title">リードが商談にならない壁は、『次の会話』の材料不足かもしれない</span>
          </a>
          <p class="article-meta">ナレッジ記事 / リード商談化の壁 / 2026-05-26</p>
          <p class="rejection-reason"><span>不採用理由:</span> 論理の一貫性の不足と、日本語の違和感が多すぎる事。</p>
        </li>
      </ol>
    </details>

    <details class="status-section">
      <summary>
        <span>投稿済み記事</span>
        <span class="count" data-count-for="posted">0</span>
      </summary>
      <ol class="article-list" id="posted">
        <li class="empty">投稿済みの記事はまだありません。</li>
      </ol>
    </details>
  </main>

  <script src="assets/review-site.js"></script>
</body>
</html>
